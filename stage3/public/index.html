<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Stage 3 - transform</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  #status, #meta { color: #999; font-size: 13px; }
  #meta b { color: #333; }
  textarea { width: 100%; height: 240px; font-size: 16px; line-height: 1.6; padding: 10px; box-sizing: border-box; }
  #log { background: #f6f6f6; border: 1px solid #eee; font-size: 12px; padding: 8px; height: 160px; overflow-y: auto; white-space: pre-wrap; }
  label { font-size: 13px; color: #555; }
</style>
</head>
<body>
<h1>Stage 3：transform —— 过期操作被修正，不再被拒绝</h1>
<p>
  <span id="status">连接中…</span> ｜
  <label><input type="checkbox" id="delay" checked> 模拟网络延迟 800ms</label>
</p>
<p id="meta"></p>
<textarea id="editor"></textarea>
<p style="color:#999;font-size:13px">操作日志：</p>
<div id="log"></div>

<script type="module">
  import { applyOp, transform } from '/ot.mjs';

  const editor = document.getElementById('editor');
  const statusEl = document.getElementById('status');
  const metaEl = document.getElementById('meta');
  const logEl = document.getElementById('log');
  const delayEl = document.getElementById('delay');
  const ws = new WebSocket(`ws://${location.host}`);

  const clientId = Math.random().toString(36).slice(2, 8);

  // ---------- 客户端状态（和 Stage 2 相同的三件套）----------
  let rev = 0;          // 我看到的最新服务端版本
  let pending = null;   // 已发送未确认的操作（其坐标会随远端操作不断变换）
  let lastSent = null;  // pending 最初发送时的样子（用于对比服务端是否做了修正）
  const buffer = [];    // 本地已应用、待发送的操作
  let oldValue = '';

  function diffToOps(oldText, newText) {
    let start = 0;
    const minLen = Math.min(oldText.length, newText.length);
    while (start < minLen && oldText[start] === newText[start]) start++;
    let oldEnd = oldText.length, newEnd = newText.length;
    while (oldEnd > start && newEnd > start && oldText[oldEnd - 1] === newText[newEnd - 1]) { oldEnd--; newEnd--; }
    const ops = [];
    if (oldEnd > start) ops.push({ kind: 'delete', pos: start, len: oldEnd - start });
    if (newEnd > start) ops.push({ kind: 'insert', pos: start, str: newText.slice(start, newEnd) });
    return ops;
  }

  function sendOp(op) {
    pending = op;
    lastSent = { ...op };
    rawSend({ type: 'op', op, baseRev: rev, from: clientId });
    log(`发送 baseRev=${rev}`, op);
  }
  function pushOrSend(op) {
    if (pending) buffer.push(op);
    else sendOp(op);
  }
  function rawSend(msg) {
    const payload = JSON.stringify(msg);
    if (delayEl.checked) setTimeout(() => ws.send(payload), 800);
    else ws.send(payload);
  }

  editor.addEventListener('input', () => {
    const ops = diffToOps(oldValue, editor.value);
    oldValue = editor.value;
    refreshMeta();
    for (const op of ops) pushOrSend(op);
  });

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.type === 'init') {
      editor.value = msg.text; oldValue = msg.text; rev = msg.rev;
    }

    if (msg.type === 'op') {
      if (msg.from === clientId) {
        // ---------- 回执 ----------
        // 服务端广播的 op 如果和 lastSent 不同，说明它被 transform 修正过。
        // 而此时 pending 应该已经被本地变换成了完全一样的形态——借此自校验：
        rev = msg.rev;
        if (JSON.stringify(msg.op) !== JSON.stringify(pending)) {
          logEl.textContent += `【警告】回执与本地 pending 不一致！transform 实现有 bug\n  服务端: ${JSON.stringify(msg.op)}\n  本地:   ${JSON.stringify(pending)}\n`;
        } else if (JSON.stringify(msg.op) !== JSON.stringify(lastSent)) {
          logEl.textContent += `【服务端修正了坐标，与本地一致 ✅】${JSON.stringify(lastSent)} → ${JSON.stringify(msg.op)}\n`;
        } else {
          log(`回执 rev=${rev}`, msg.op);
        }
        // textarea 不用动：我的操作早已按本地顺序应用，
        // transformX 的数学性质保证"我先应用再补别人的"与"服务端先应用别人的再应用我的"结果相同。
        pending = null; lastSent = null;
        if (buffer.length > 0) sendOp(buffer.shift());
      } else {
        // ---------- 收到别人的操作 ----------
        // 它排在服务端定序里我所有未确认操作（pending + buffer）之前。
        // 所以：① 把它针对 pending/buffer 变换后再应用到 textarea
        //       ② 把 pending/buffer 针对它变换（保持坐标有效）
        let opPrime = msg.op;
        if (pending) {
          opPrime = transform(msg.op, pending, true);
          pending = transform(pending, msg.op, false);
          for (let i = 0; i < buffer.length; i++) {
            const b = buffer[i];
            buffer[i] = transform(b, opPrime, false);
            opPrime = transform(opPrime, b, true);
          }
          log(`接收(已本地变换) rev=${msg.rev}`, opPrime);
        } else {
          log(`接收 rev=${msg.rev}`, opPrime);
        }
        applyRemote(opPrime);
        rev = msg.rev;
      }
    }
    refreshMeta();
  };

  function applyRemote(op) {
    const cursor = editor.selectionStart;
    editor.value = applyOp(editor.value, op);
    oldValue = editor.value;
    // 朴素光标修正（Stage 5 会换成真正的光标 transform）
    let c = cursor;
    if (op.kind === 'insert' && op.pos <= cursor) c = cursor + op.str.length;
    if (op.kind === 'delete') {
      if (op.pos + op.len <= cursor) c = cursor - op.len;
      else if (op.pos < cursor) c = op.pos;
    }
    editor.selectionStart = editor.selectionEnd = c;
  }

  // ---------- 辅助 ----------
  ws.onopen = () => (statusEl.textContent = '已连接');
  ws.onclose = () => (statusEl.textContent = '已断开');

  function log(prefix, op) {
    logEl.textContent += `${prefix} ${JSON.stringify(op)}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }
  function checksum(s) {
    let h = 0;
    for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return h.toString(16);
  }
  function refreshMeta() {
    metaEl.innerHTML = `rev=<b>${rev}</b> ｜ 长度 <b>${editor.value.length}</b> ｜ 校验值 <b>${checksum(editor.value)}</b> ｜ 在途 ${pending ? 1 : 0}，排队 ${buffer.length}`;
  }
  refreshMeta();
</script>
</body>
</html>
