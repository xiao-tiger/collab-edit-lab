<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Stage 1 - 操作同步</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  #status, #meta { color: #999; font-size: 13px; }
  #meta b { color: #333; }
  textarea { width: 100%; height: 240px; font-size: 16px; line-height: 1.6; padding: 10px; box-sizing: border-box; }
  #log { background: #f6f6f6; border: 1px solid #eee; font-size: 12px; padding: 8px; height: 140px; overflow-y: auto; white-space: pre-wrap; }
  label { font-size: 13px; color: #555; }
</style>
</head>
<body>
<h1>Stage 1：同步"操作"而不是"文本"</h1>
<p>
  <span id="status">连接中…</span> ｜
  <label><input type="checkbox" id="delay" checked> 模拟网络延迟 800ms（做并发实验时勾上）</label>
</p>
<p id="meta"></p>
<textarea id="editor"></textarea>
<p style="color:#999;font-size:13px">操作日志（发送 / 接收）：</p>
<div id="log"></div>

<script>
  const editor = document.getElementById('editor');
  const statusEl = document.getElementById('status');
  const metaEl = document.getElementById('meta');
  const logEl = document.getElementById('log');
  const delayEl = document.getElementById('delay');
  const ws = new WebSocket(`ws://${location.host}`);

  // ---------- 核心：操作如何应用到文档 ----------
  // 与服务端那份一模一样
  function applyOp(doc, op) {
    if (op.kind === 'insert') return doc.slice(0, op.pos) + op.str + doc.slice(op.pos);
    if (op.kind === 'delete') return doc.slice(0, op.pos) + doc.slice(op.pos + op.len);
    return doc;
  }

  // ---------- 核心：把一次输入 diff 成操作 ----------
  // 比较新旧文本，找出"公共前缀"和"公共后缀"，中间变掉的部分就是操作
  // 一次输入最多产生两个操作：先 delete 后 insert（覆盖选中区就是删+插）
  function diffToOps(oldText, newText) {
    let start = 0;
    const minLen = Math.min(oldText.length, newText.length);
    // 找到公共前缀
    while (start < minLen && oldText[start] === newText[start]) start++;
  
    let oldEnd = oldText.length, newEnd = newText.length;
    // 找到公共后缀的起始坐标
    while (oldEnd > start && newEnd > start && oldText[oldEnd - 1] === newText[newEnd - 1]) { oldEnd--; newEnd--; }

    const ops = [];
    if (oldEnd > start) ops.push({ kind: 'delete', pos: start, len: oldEnd - start });
    if (newEnd > start) ops.push({ kind: 'insert', pos: start, str: newText.slice(start, newEnd) });
    return ops;
  }

  // ---------- 发送：本地输入 → 操作 → 服务器 ----------
  let oldValue = '';
  editor.addEventListener('input', () => {
    const ops = diffToOps(oldValue, editor.value);
    oldValue = editor.value;
    refreshMeta();
    for (const op of ops) {
      log('发送', op);
      const payload = JSON.stringify({ type: 'op', op });
      // 人为延迟：让"并发"可以被稳定复现
      if (delayEl.checked) setTimeout(() => ws.send(payload), 800);
      else ws.send(payload);
    }
  });

  // ---------- 接收：服务器 → 操作 → 应用到本地 ----------
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'init') {
      editor.value = msg.text;
      oldValue = msg.text;
    } else if (msg.type === 'op') {
      log('接收', msg.op);
      applyRemote(msg.op);
    }
    refreshMeta();
  };

  function applyRemote(op) {
    const cursor = editor.selectionStart;
    editor.value = applyOp(editor.value, op);
    oldValue = editor.value;
    // 朴素光标修正：远端操作发生在光标之前 → 光标跟着挪
    // （注意：这其实已经是 transform 思想的萌芽了）
    let c = cursor;
    if (op.kind === 'insert' && op.pos <= cursor) c = cursor + op.str.length;
    if (op.kind === 'delete') {
      if (op.pos + op.len <= cursor) c = cursor - op.len;
      else if (op.pos < cursor) c = op.pos;
    }
    editor.selectionStart = editor.selectionEnd = c;
  }

  // ---------- 辅助 ----------
  ws.onopen = () => (statusEl.textContent = '已连接');
  ws.onclose = () => (statusEl.textContent = '已断开');

  function log(dir, op) {
    logEl.textContent += `${dir} ${JSON.stringify(op)}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  // 校验值：两个标签页的这个值不一样，就说明文档发散了
  function checksum(s) {
    let h = 0;
    for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return h.toString(16);
  }
  function refreshMeta() {
    metaEl.innerHTML = `当前文档：长度 <b>${editor.value.length}</b>，校验值 <b>${checksum(editor.value)}</b>`;
  }
  refreshMeta();
</script>
</body>
</html>
