<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>CRDT C2 · 迷你 RGA 文本协同</title>
<style>
  :root {
    --ink:#171717; --dim:#666; --border:#eaeaea; --panel:#fafafa;
    --a:#0070f3; --b:#d97706; --srv:#059669; --bad:#dc2626;
  }
  body { font-family: -apple-system, 'PingFang SC', sans-serif; max-width: 1080px; margin: 32px auto; padding: 0 16px; color: var(--ink); }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 14px; margin-top: 0; }
  .badge { font-family: ui-monospace, monospace; font-size: 12px; background: rgba(5,150,105,.08);
           color: var(--srv); border: 1px solid var(--srv); border-radius: 999px; padding: 2px 10px; }
  .controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 13px;
              background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
              padding: 10px 14px; margin: 18px 0; }
  .controls label { color: var(--dim); cursor: pointer; }
  .arena { display: grid; grid-template-columns: 1fr 200px 1fr; gap: 14px; }
  .node { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .node h2 { font-family: ui-monospace, monospace; font-size: 13px; margin: 0 0 10px; }
  .node.a h2 { color: var(--a); } .node.b h2 { color: var(--b); }
  textarea { width: 100%; height: 90px; box-sizing: border-box; padding: 8px; font-size: 15px;
             border: 1px solid var(--border); border-radius: 8px; font-family: ui-monospace, monospace; }
  .structLabel { font-size: 11px; color: var(--dim); margin: 10px 0 6px; }
  .struct { display: flex; flex-wrap: wrap; gap: 3px; min-height: 30px; background: var(--panel);
            border: 1px solid var(--border); border-radius: 8px; padding: 6px; }
  .item { font-family: ui-monospace, monospace; font-size: 12px; background: #fff;
          border: 1px solid var(--border); border-radius: 4px; padding: 3px 5px; }
  .item .id { font-size: 9px; color: var(--dim); vertical-align: super; margin-left: 1px; }
  .item.tomb { text-decoration: line-through; opacity: .45; background: #fafafa; }
  .pipe { background: var(--panel); border: 1px dashed var(--border); border-radius: 12px; padding: 10px; }
  .pipe h3 { font-size: 12px; color: var(--dim); margin: 0 0 8px; font-weight: 600; }
  #netlog { overflow-y: auto; font-family: ui-monospace, monospace; font-size: 11px;
            line-height: 1.7; max-height: 300px; }
  #netlog .chaos { color: var(--bad); }
  #verdict { text-align: center; font-family: ui-monospace, monospace; font-size: 14px; margin-top: 16px; }
  #verdict .ok { color: var(--srv); font-weight: 700; }
  #verdict .syncing { color: var(--b); }
</style>
</head>
<body>
<h1>Stage C2：迷你 RGA <span class="badge">给每个字符发身份证</span></h1>
<p class="sub">每个字符 = <code>{id, left, deleted}</code>。合并 = 按 id 求并集。墓碑以删除线展示，可以看到它们一直留在结构里。</p>

<div class="controls">
  <b>网络捣乱开关：</b>
  <label><input type="checkbox" id="chaosDup"> 重复投递</label>
  <label><input type="checkbox" id="chaosShuffle"> 乱序/大抖动</label>
  <span style="color:var(--dim)">（注意：状态型同步对这些天然免疫）</span>
</div>

<div class="arena">
  <div class="node a" data-node="A"></div>
  <div class="pipe">
    <h3>网络管道</h3>
    <div id="netlog"></div>
  </div>
  <div class="node b" data-node="B"></div>
</div>
<p id="verdict"></p>

<script src="rga.js"></script>
<script>
  const A = { id: 'A', rga: makeRGA('A'), el: null, oldValue: '' };
  const B = { id: 'B', rga: makeRGA('B'), el: null, oldValue: '' };
  const nodes = { A, B };
  const other = (id) => (id === 'A' ? 'B' : 'A');
  const netlog = document.getElementById('netlog');
  const verdict = document.getElementById('verdict');
  const chaosDup = document.getElementById('chaosDup');
  const chaosShuffle = document.getElementById('chaosShuffle');
  let inFlight = 0;

  function diffToOps(oldText, newText) {
    let start = 0;
    const minLen = Math.min(oldText.length, newText.length);
    while (start < minLen && oldText[start] === newText[start]) start++;
    let oldEnd = oldText.length, newEnd = newText.length;
    while (oldEnd > start && newEnd > start && oldText[oldEnd - 1] === newText[newEnd - 1]) { oldEnd--; newEnd--; }
    const ops = [];
    if (oldEnd > start) ops.push({ kind: 'delete', pos: start, len: oldEnd - start });
    if (newEnd > start) ops.push({ kind: 'insert', pos: start, str: newText.slice(start, newEnd) });
    return ops;
  }

  // 本地输入 → RGA 操作（insert 逐字符链式：后一个字符的 left = 前一个的 id）
  function onInput(node) {
    const ops = diffToOps(node.oldValue, node.el.value);
    for (const op of ops) {
      if (op.kind === 'delete') rgaDelete(node.rga, op.pos, op.len);
      else for (let i = 0; i < op.str.length; i++) rgaInsert(node.rga, op.pos + i, op.str[i]);
    }
    node.oldValue = node.el.value;
    broadcast(node);
    render();
  }

  // ---------- 虚拟网络：发送整个 Item 集合（状态型同步）----------
  function broadcast(from) {
    const snapshot = [...from.rga.items.values()].map((i) => ({ ...i }));
    const to = other(from.id);
    const jitter = chaosShuffle.checked ? Math.floor(Math.random() * 900) : 0;
    send(to, from.id, snapshot, jitter, '');
    if (chaosDup.checked) send(to, from.id, snapshot, jitter + 60, '（重复）');
  }
  function send(toId, fromId, snapshot, delay, tag) {
    inFlight++;
    nlog(`${fromId} → ${toId} ${snapshot.length} 个 Item ${tag}`);
    setTimeout(() => {
      inFlight--;
      rgaMerge(nodes[toId].rga, snapshot);
      // 合并后重渲染该节点文本（这就是"同步"）
      const n = nodes[toId];
      const text = rgaText(n.rga);
      if (n.el.value !== text) { n.el.value = text; n.oldValue = text; }
      render();
    }, 400 + delay);
  }
  function nlog(text) {
    const line = document.createElement('div');
    if (text.includes('重复')) line.className = 'chaos';
    line.textContent = text;
    netlog.appendChild(line);
    netlog.scrollTop = netlog.scrollHeight;
  }

  function render() {
    for (const id of ['A', 'B']) renderNode(nodes[id]);
    const same = rgaText(A.rga) === rgaText(B.rga) && A.rga.items.size === B.rga.items.size;
    verdict.innerHTML = same && inFlight === 0
      ? '<span class="ok">两端一致 ✅（文本与结构完全相同）</span>'
      : '<span class="syncing">同步中…</span>';
  }

  function renderNode(node) {
    const host = document.querySelector(`[data-node="${node.id}"]`);
    if (!node.el) {
      host.innerHTML = '';
      const h = document.createElement('h2'); h.textContent = '节点 ' + node.id;
      const ta = document.createElement('textarea');
      ta.placeholder = `在 ${node.id} 输入…`;
      ta.addEventListener('input', () => onInput(node));
      const label = document.createElement('div'); label.className = 'structLabel';
      label.textContent = '内部结构（字符 + id 上标；删除线 = 墓碑）：';
      const struct = document.createElement('div'); struct.className = 'struct';
      host.append(h, ta, label, struct);
      node.el = ta; node.structEl = struct;
    }
    node.structEl.innerHTML = '';
    for (const it of rgaSequence(node.rga, true)) {
      const chip = document.createElement('span');
      chip.className = 'item' + (it.deleted ? ' tomb' : '');
      const ch = document.createElement('span'); ch.textContent = it.ch === ' ' ? '␣' : it.ch;
      const idEl = document.createElement('span'); idEl.className = 'id'; idEl.textContent = it.id;
      chip.append(ch, idEl);
      node.structEl.appendChild(chip);
    }
  }

  render();
</script>
</body>
</html>
