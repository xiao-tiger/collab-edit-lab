<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>CRDT C2 · 迷你 RGA 文本协同</title>
<style>
  :root {
    --ink:#171717; --dim:#666; --border:#eaeaea; --panel:#fafafa;
    --a:#0070f3; --b:#d97706; --srv:#059669; --bad:#dc2626;
  }
  body { font-family: -apple-system, 'PingFang SC', sans-serif; max-width: 1080px; margin: 32px auto; padding: 0 16px; color: var(--ink); }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 14px; margin-top: 0; }
  .badge { font-family: ui-monospace, monospace; font-size: 12px; background: rgba(5,150,105,.08);
           color: var(--srv); border: 1px solid var(--srv); border-radius: 999px; padding: 2px 10px; }
  .controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 13px;
              background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
              padding: 10px 14px; margin: 18px 0; }
  .controls label { color: var(--dim); cursor: pointer; }
  .arena { display: grid; grid-template-columns: 1fr 200px 1fr; gap: 14px; }
  .node { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .node h2 { font-family: ui-monospace, monospace; font-size: 13px; margin: 0 0 10px; }
  .node.a h2 { color: var(--a); } .node.b h2 { color: var(--b); }
  textarea { width: 100%; height: 90px; box-sizing: border-box; padding: 8px; font-size: 15px;
             border: 1px solid var(--border); border-radius: 8px; font-family: ui-monospace, monospace; }
  .structLabel { font-size: 11px; color: var(--dim); margin: 10px 0 6px; }
  .struct { display: flex; flex-wrap: wrap; gap: 3px; min-height: 30px; background: var(--panel);
            border: 1px solid var(--border); border-radius: 8px; padding: 6px; }
  .item { font-family: ui-monospace, monospace; font-size: 12px; background: #fff;
          border: 1px solid var(--border); border-radius: 4px; padding: 3px 5px; }
  .item .id { font-size: 9px; color: var(--dim); vertical-align: super; margin-left: 1px; }
  .item.tomb { text-decoration: line-through; opacity: .45; background: #fafafa; }
  .pipe { background: var(--panel); border: 1px dashed var(--border); border-radius: 12px; padding: 10px; }
  .pipe h3 { font-size: 12px; color: var(--dim); margin: 0 0 8px; font-weight: 600; }
  #netlog { overflow-y: auto; font-family: ui-monospace, monospace; font-size: 11px;
            line-height: 1.7; max-height: 300px; }
  #netlog .chaos { color: var(--bad); }
  #verdict { text-align: center; font-family: ui-monospace, monospace; font-size: 14px; margin-top: 16px; }
  #verdict .ok { color: var(--srv); font-weight: 700; }
  #verdict .syncing { color: var(--b); }
</style>
</head>
<body>
<h1>Stage C2：迷你 RGA <span class="badge">给每个字符发身份证</span></h1>
<p class="sub">每个字符 = <code>{id, left, deleted}</code>。合并 = 按 id 求并集。墓碑以删除线展示，可以看到它们一直留在结构里。</p>

<div class="controls">
  <b>网络捣乱开关：</b>
  <label><input type="checkbox" id="chaosDup"> 重复投递</label>
  <label><input type="checkbox" id="chaosShuffle"> 乱序/大抖动</label>
  <span style="color:var(--dim)">（注意：状态型同步对这些天然免疫）</span>
</div>

<div class="arena">
  <div class="node a">
    <h2>节点 A</h2>
    <textarea id="taA" placeholder="在 A 输入…"></textarea>
    <div class="structLabel">内部结构（字符 + id 上标；删除线 = 墓碑）：</div>
    <div class="struct" id="structA"></div>
  </div>
  <div class="pipe">
    <h3>网络管道</h3>
    <div id="netlog"></div>
  </div>
  <div class="node b">
    <h2>节点 B</h2>
    <textarea id="taB" placeholder="在 B 输入…"></textarea>
    <div class="structLabel">内部结构（字符 + id 上标；删除线 = 墓碑）：</div>
    <div class="struct" id="structB"></div>
  </div>
</div>
<p id="verdict"></p>

<!-- 三层结构：算法（rga.js）→ 数据层（sim.js）→ 渲染层（app.js） -->
<script src="rga.js"></script>
<script src="sim.js"></script>
<script src="app.js"></script>
</body>
</html>
