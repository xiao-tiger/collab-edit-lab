<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>CRDT C3 · 离线合并实测</title>
<style>
  :root {
    --ink:#171717; --dim:#666; --border:#eaeaea; --panel:#fafafa;
    --a:#0070f3; --b:#d97706; --srv:#059669; --bad:#dc2626;
  }
  body { font-family: -apple-system, 'PingFang SC', sans-serif; max-width: 1080px; margin: 32px auto; padding: 0 16px; color: var(--ink); }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 14px; margin-top: 0; }
  .badge { font-family: ui-monospace, monospace; font-size: 12px; background: rgba(5,150,105,.08);
           color: var(--srv); border: 1px solid var(--srv); border-radius: 999px; padding: 2px 10px; }
  .controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 13px;
              background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
              padding: 10px 14px; margin: 18px 0; }
  button.net { font-size: 14px; padding: 8px 18px; border: 1px solid var(--border); border-radius: 8px;
               background: #fff; cursor: pointer; font-weight: 600; }
  button.net.offline { background: var(--bad); color: #fff; border-color: var(--bad); }
  .arena { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .node { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .node h2 { font-family: ui-monospace, monospace; font-size: 13px; margin: 0 0 10px; }
  .node.a h2 { color: var(--a); } .node.b h2 { color: var(--b); }
  textarea { width: 100%; height: 110px; box-sizing: border-box; padding: 8px; font-size: 15px;
             border: 1px solid var(--border); border-radius: 8px; font-family: ui-monospace, monospace; }
  .dirty { font-family: ui-monospace, monospace; font-size: 11px; color: var(--b); margin-top: 8px; min-height: 16px; }
  #verdict { text-align: center; font-family: ui-monospace, monospace; font-size: 14px; margin-top: 16px; }
  #verdict .ok { color: var(--srv); font-weight: 700; }
  #verdict .offline { color: var(--b); font-weight: 700; }
</style>
</head>
<body>
<h1>Stage C3：离线合并实测 <span class="badge">CRDT 的主场</span></h1>
<p class="sub">断开网络 → 两端随便改（内容自由分叉）→ 重新连接 → 互换一次最终状态即收敛。<b>状态型 CRDT 离线只需互换最终快照</b>，不用缓存重放全部操作。</p>

<div class="controls">
  <button class="net" id="netBtn">⚡ 断开网络</button>
  <span id="netState" style="color:var(--srv)">在线</span>
  <span style="color:var(--dim)">实验：断网 → 两边各打一段 → 重连 → 瞬间收敛</span>
</div>

<div class="arena">
  <div class="node a" data-node="A"></div>
  <div class="node b" data-node="B"></div>
</div>
<p id="verdict"></p>

<script src="rga.js"></script>
<script>
  const A = { id: 'A', rga: makeRGA('A'), el: null, oldValue: '', dirty: false };
  const B = { id: 'B', rga: makeRGA('B'), el: null, oldValue: '', dirty: false };
  const nodes = { A, B };
  let online = true;

  const netBtn = document.getElementById('netBtn');
  const netState = document.getElementById('netState');
  const verdict = document.getElementById('verdict');

  function diffToOps(oldText, newText) {
    let start = 0;
    const minLen = Math.min(oldText.length, newText.length);
    while (start < minLen && oldText[start] === newText[start]) start++;
    let oldEnd = oldText.length, newEnd = newText.length;
    while (oldEnd > start && newEnd > start && oldText[oldEnd - 1] === newText[newEnd - 1]) { oldEnd--; newEnd--; }
    const ops = [];
    if (oldEnd > start) ops.push({ kind: 'delete', pos: start, len: oldEnd - start });
    if (newEnd > start) ops.push({ kind: 'insert', pos: start, str: newText.slice(start, newEnd) });
    return ops;
  }

  function onInput(node) {
    const ops = diffToOps(node.oldValue, node.el.value);
    for (const op of ops) {
      if (op.kind === 'delete') rgaDelete(node.rga, op.pos, op.len);
      else for (let i = 0; i < op.str.length; i++) rgaInsert(node.rga, op.pos + i, op.str[i]);
    }
    node.oldValue = node.el.value;
    if (online) syncNode(node);
    else node.dirty = true; // 离线：只记一笔"我有未同步变更"，最终状态本身就在本地
    render();
  }

  // 状态型同步：只发最终快照（离线期间的 N 次编辑被自然压缩成一份状态）
  function syncNode(node) {
    const snapshot = [...node.rga.items.values()].map((i) => ({ ...i }));
    const target = nodes[node.id === 'A' ? 'B' : 'A'];
    setTimeout(() => {
      rgaMerge(target.rga, snapshot);
      const text = rgaText(target.rga);
      if (target.el.value !== text) { target.el.value = text; target.oldValue = text; }
      render();
    }, 300);
  }

  netBtn.addEventListener('click', () => {
    online = !online;
    netBtn.textContent = online ? '⚡ 断开网络' : '🔌 重新连接';
    netBtn.className = online ? 'net' : 'net offline';
    netState.textContent = online ? '在线' : '离线（两端各自编辑）';
    netState.style.color = online ? 'var(--srv)' : 'var(--bad)';
    if (online) {
      // 重连：互换一次最终状态即收敛
      if (A.dirty) { syncNode(A); A.dirty = false; }
      if (B.dirty) { syncNode(B); B.dirty = false; }
    }
    render();
  });

  function render() {
    for (const id of ['A', 'B']) {
      const node = nodes[id];
      const host = document.querySelector(`[data-node="${id}"]`);
      if (!node.el) {
        host.innerHTML = '';
        const h = document.createElement('h2'); h.textContent = '节点 ' + id;
        const ta = document.createElement('textarea');
        ta.placeholder = `在 ${id} 输入…`;
        ta.addEventListener('input', () => onInput(node));
        const dirty = document.createElement('div'); dirty.className = 'dirty';
        host.append(h, ta, dirty);
        node.el = ta; node.dirtyEl = dirty;
      }
      node.dirtyEl.textContent = node.dirty ? '● 有未同步的本地变更' : '';
    }
    const same = rgaText(A.rga) === rgaText(B.rga);
    verdict.innerHTML = same
      ? '<span class="ok">两端一致 ✅</span>'
      : (online ? '<span class="ok">同步中…</span>' : '<span class="offline">已分叉（离线中，重连即可合并）</span>');
  }

  render();
</script>
</body>
</html>
